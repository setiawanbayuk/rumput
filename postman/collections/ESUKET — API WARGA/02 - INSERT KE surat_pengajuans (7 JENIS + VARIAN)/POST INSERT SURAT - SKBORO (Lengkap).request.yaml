$kind: http-request
description: Body multipart lengkap untuk skboro. Pengantar sebagai File; field tambahan dikirim flat dan disimpan sebagai variable JSON oleh backend.
url: "{{local}}/api/surat/store"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: jenis_surat
      value: skboro
    - type: text
      key: nik
      value: "{{nik_warga}}"
    - type: text
      key: peruntukan
      value: Keperluan tinggal sementara
    - type: text
      key: provinsi_boro
      value: Jawa Timur
    - type: text
      key: kabko_boro
      value: Kota Surabaya
    - type: text
      key: kecamatan_boro
      value: Wonokromo
    - type: text
      key: kelurahan_boro
      value: Darmo
    - type: text
      key: alamat_boro
      value: Alamat tujuan boro lengkap
    - type: text
      key: tgl_awal
      value: 2026-11-01
    - type: text
      key: tgl_akhir
      value: 2026-11-30
    - type: text
      key: jumlah_pengikut
      value: "0"
    - type: file
      key: pengantar
      src: []
      description: PILIH ULANG JPG/JPEG/PNG asli, <= 2 MiB (wajib). Jangan gunakan path file lama.
scripts:
  - type: afterResponse
    code: |-
      let payload = {};
      try { payload = pm.response.json(); } catch (e) {}
      pm.test('POST surat berhasil (201)', function () { pm.response.to.have.status(201); });
      pm.test('Respons sukses + ID surat tersedia', function () {
        pm.expect(payload.status).to.eql('success');
        pm.expect(payload.data).to.be.an('object');
        pm.expect(payload.data.id || payload.data.pengajuan_id).to.exist;
      });
      if (pm.response.code === 201 && payload.data) {
        const id = payload.data.id || payload.data.pengajuan_id;
        if (id) {
          if (pm.environment.name) pm.environment.set('pengajuan_id', String(id));
          else pm.collectionVariables.set('pengajuan_id', String(id));
        }
      }
      if (pm.response.code === 422) console.warn('Validasi gagal:', payload.errors || payload);
      if (pm.response.code === 500) console.warn('Periksa log Laravel dan struktur jenis_surats:', payload.message || payload);
    language: text/javascript
order: 11000
