$kind: http-request
description: Pastikan NIK ada pada residents. Jika 404, permohonan universal akan gagal.
url: "{{local}}/api/resident?nik={{nik_warga}}"
method: GET
headers:
  Accept: application/json
queryParams:
  nik: "{{nik_warga}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP sukses', function () { pm.expect(pm.response.code).to.be.oneOf([200,201]); });
    language: text/javascript
order: 10000
